name: Make lockfile
on: workflow_dispatch
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: |
          mkdir proj
          unzip -q *.zip -d proj
          cd proj
          rm -f bun.lock bun.lockb
          bun install
          rm -rf node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: project-with-lock
          path: proj
