name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: |
          unzip -q chess-helper-v2.zip -d proj
          cd proj
          sed -i 's|if (cnt\[k\] > 0) m\[k\] /= cnt\[k\]|if (cnt[k] > 0) { m[k] = m[k] / cnt[k] }|' modules/chess-helper-native/android/src/main/java/ai/venice/chesshelper/nativemod/BoardRecognizer.kt
          rm -f bun.lock bun.lockb
          bun install
          bunx expo prebuild --platform android --no-install
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: chess-helper-apk
          path: proj/android/app/build/outputs/apk/release/*.apk
